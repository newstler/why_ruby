  # Shared values - defined here to be referenced elsewhere
  shared:
    site:
      name: &site_name "WhyRuby.info"
      app_name: &app_name "Why Ruby?"
      apple_app_title: &apple_app_title "WhyRuby"
    community:
      title: &community_title "Community"
      description: &community_description "Connect with %{count} passionate Ruby developers from around the world and explore their projects, posts, and stories"
      description_static: &community_description_static "Connect with passionate Ruby developers from around the world and explore their projects, posts, and stories"
      keywords: &community_keywords "ruby developers, ruby community, ruby programmers, rails developers"
    keywords:
      base: &keywords_base "Ruby, Ruby on Rails"
      programming: &keywords_programming "programming, web development"
  
  auth:
    sign_in_with_github: "Sign in with GitHub"
  
  comments:
    sign_in_to_comment: "Sign in to leave a comment."
  
  posts:
    draft: "Draft"
    form:
      tags:
        label: "Tags"
        placeholder: "Type to search tags or create new ones (separate with commas)"
        placeholder_with_tags: "Add more tags..."
        help_text: "Press Enter or comma to add a tag. Start typing to see suggestions."
        create_new: "Create new tag:"
  
  meta:
    community:
      site_name: "Ruby Community"
    default:
      title: "Why Ruby?"
      summary: "Join the Ruby community! Discover why developers love Ruby, share your experiences, and explore resources for learning and mastering Ruby and Rails."
      keywords: "Ruby, Ruby on Rails, Rails, programming, web development, Ruby community, Ruby tutorials, Ruby resources, Ruby advocacy, why Ruby"
      author: "Yuri Sidorov"
    site:
      name: *site_name
      application_name: *app_name
      apple_app_title: *apple_app_title
    social:
      twitter_site: "@yurisidorov"
      twitter_creator: "@yurisidorov"
    posts:
      show:
        title: "%{post_title}"
        keywords: "%{categories_and_tags}, Ruby, Rails"
    categories:
      show:
        title: "%{category_name}"
        summary: "Browse all Ruby %{category_name_lower} posts, articles, and resources shared by the WhyRuby community."
        keywords: "%{category_name}, Ruby, Ruby on Rails, programming, web development"
    tags:
      show:
        title: "#%{tag_name}"
        summary: "Explore Ruby posts and resources tagged with #%{tag_name} on WhyRuby.info"
        keywords: "%{tag_name}, Ruby, Ruby on Rails, programming, tags"
    users:
      index:
        title: *community_title
        summary: *community_description_static
        keywords: *community_keywords
      show:
        title: "%{display_name} (@%{username})"
        summary_with_bio: "%{bio}"
        summary_without_bio: "View %{display_name}'s profile and contributions to the Ruby community on RubyCommunity.org"
        keywords: "%{username}, Ruby developer, Ruby community, profile"
  
  users:
    index:
      title: *community_title
      description: *community_description
      join: "Join"
      join_suffix: "%{count} passionate Ruby developers from around the world and explore their projects, posts, and stories"
      developer_count:
