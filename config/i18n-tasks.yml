# i18n-tasks configuration
# https://github.com/glebm/i18n-tasks

base_locale: en
locales: [en]

# Paths to translation files
data:
  read:
    - config/locales/%{locale}.yml
    - config/locales/%{locale}/**/*.yml

# Paths to scan for translation keys
search:
  paths:
    - app/

  # Patterns to ignore
  exclude:
    - app/assets/

# Report missing and unused keys
ignore_missing:
  - 'activerecord.*'
  - 'errors.*'
  - 'helpers.select.*'
  - 'number.*'
  - 'date.*'
  - 'time.*'
  - 'support.*'
  - 'helpers.submit.*'

ignore_unused:
  - 'activerecord.*'
  - 'date.*'
  - 'time.*'
  - 'number.*'
  - 'support.*'
  # Allow common keys to be defined even if not always used
  - 'common.*'
  - 'app_name'
  - 'messages.count'
  # Mobility translation keys are dynamic
  - 'mobility.*'
  # WhyRuby: country codes used dynamically via country_name helper
  - 'countries.*'
  # WhyRuby: meta tags referenced in content_for :head blocks
  - 'meta.*'
  # WhyRuby: shared YAML anchors referenced throughout
  - 'shared.*'
  # WhyRuby: sort labels used dynamically in users/index
  - 'users.index.sort.*'
  - 'users.index.sort_label'
  - 'users.index.title'
  - 'users.index.description'
  - 'users.index.join'
  - 'users.index.join_suffix'
  - 'users.index.keywords'
  - 'users.repository_tile.*'
  # WhyRuby: auth and controller messages
  - 'auth.*'
  - 'controllers.*'
  # Template home page keys (kept for reference, overridden by our views)
  - 'home.index.*'
  # Languages and OG image
  - 'languages.*'
  - 'og_image.*'
  - 'language_name'
  - 'native_name'
  - 'hello'
